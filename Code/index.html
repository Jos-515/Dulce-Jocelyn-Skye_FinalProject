<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Digital Aquarium</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #111; 
        margin: 0;
      }
      canvas {
        border: 26px solid #1f1f1f;
        border-top-color: #2c2c2c;
        border-left-color: #252525;
        border-right-color: #151515;
        border-bottom-color: #0e0e0e;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 20px 40px rgba(0, 0, 0, 0.95);
        /* The border around the aquarium is styled like a three dimensional frame, utilising different shades of gray to create depth and a 3D form. 
        This way it felt like teh aquarium was a piece of art, making it more visually interesting and clearly defined against the black background.
        */
      }
    </style>

  </head>

    </main>

  </body>
